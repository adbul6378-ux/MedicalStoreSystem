<!doctype html><html lang="en"><head><link rel="stylesheet" href="medical-theme.css"><script src="medical-theme.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Customer - Medical Store</title><style>body{margin:0;background:#f4f6f9;color:#1f2937;font:14px Segoe UI,sans-serif}.page{max-width:700px;margin:0 auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{margin:0;font-size:26px}.back{color:#2563eb;font-weight:600;text-decoration:none}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:24px;box-shadow:0 8px 24px rgba(15,23,42,.05)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;color:#6b7280;font-size:12px;font-weight:600}label.full{grid-column:1/-1}input{width:100%;margin-top:7px;padding:12px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box;font:inherit}input:focus{outline:2px solid rgba(37,99,235,.18);border-color:#2563eb}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.button{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.cancel{background:#f1f5f9;color:#1f2937;text-decoration:none}.save{background:#2563eb;color:#fff}.message{display:none;margin:0 0 18px;padding:10px 12px;border-radius:7px;background:#ecfdf5;color:#047857}@media(max-width:560px){header,.grid{display:block}header .back{display:inline-block;margin-top:10px}label{margin-top:16px}}</style></head><body><main class="page"><header><h1 id="formTitle">Add Customer</h1><a class="back" href="customer.html">Back to Customers</a></header><form class="card" id="customerForm"><p class="message" id="formMessage" role="status"></p><div class="grid"><label>Customer name<input id="customerName" required></label><label>Phone number<input id="customerPhone" required></label><label class="full">Email address<input id="customerEmail" type="email"></label><label class="full">Address<input id="customerAddress"></label></div><div class="actions"><a class="button cancel" href="customer.html">Cancel</a><button class="button save" type="submit" id="saveCustomer">Save Customer</button></div></form></main><script>const customerStorageKey='medicalStoreCustomers';const customers=JSON.parse(localStorage.getItem(customerStorageKey)||'[]');const params=new URLSearchParams(window.location.search);const editId=Number(params.get('edit'))||null;const fields={name:document.getElementById('customerName'),phone:document.getElementById('customerPhone'),email:document.getElementById('customerEmail'),address:document.getElementById('customerAddress')};const existing=editId?customers.find(customer=>customer.id===editId):null;if(existing){document.getElementById('formTitle').textContent='Edit Customer';document.getElementById('saveCustomer').textContent='Update Customer';Object.keys(fields).forEach(key=>fields[key].value=existing[key]||'')}document.getElementById('customerForm').addEventListener('submit',event=>{event.preventDefault();const values={name:fields.name.value.trim(),phone:fields.phone.value.trim(),email:fields.email.value.trim(),address:fields.address.value.trim()};if(existing)Object.assign(existing,values);else customers.push({id:customers.reduce((max,customer)=>Math.max(max,Number(customer.id)||0),0)+1,...values,purchases:0,spent:0,last:'No purchases yet',type:'New Customer'});localStorage.setItem(customerStorageKey,JSON.stringify(customers));const message=document.getElementById('formMessage');message.textContent=existing?'Customer updated successfully.':'Customer added successfully.';message.style.display='block';setTimeout(()=>{window.location.href='customer.html'},350)})</script></body></html>
